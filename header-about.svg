<svg width="1000" height="90" viewBox="0 0 1000 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f0c29" stop-opacity="0"/>
      <stop offset="50%" stop-color="#1b1440" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0f0c29" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="glassStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="90" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <circle cx="500" cy="45" r="90" fill="url(#glowL)"/>
  </g>

  <rect x="330" y="18" width="340" height="54" rx="27" fill="url(#glassFill)" stroke="url(#glassStroke)" stroke-width="1.2"/>
  <rect x="333" y="21" width="334" height="24" rx="12" fill="#ffffff" opacity="0.06"/>

  <text x="500" y="52" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="21" font-weight="600" letter-spacing="1.5" fill="#f3f2ff">ICON_TXT#9679; WHOAMI</text>
</svg>
