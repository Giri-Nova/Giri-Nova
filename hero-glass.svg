<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#1b1440"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <filter id="heavyBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="cardBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="glassStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c9c9ff"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1000" height="320" fill="url(#bgGrad)"/>

  <!-- blurred blobs (create the depth glass will refract) -->
  <g filter="url(#heavyBlur)">
    <circle cx="150" cy="60" r="140" fill="url(#blob1)"/>
    <circle cx="820" cy="260" r="170" fill="url(#blob2)"/>
    <circle cx="700" cy="40" r="110" fill="url(#blob3)"/>
    <circle cx="330" cy="290" r="120" fill="url(#blob2)"/>
  </g>

  <!-- glass card -->
  <rect x="60" y="55" width="880" height="210" rx="28" fill="url(#glassFill)" stroke="url(#glassStroke)" stroke-width="1.4" filter="url(#cardBlur)"/>
  <!-- top light sheen -->
  <rect x="60" y="55" width="880" height="60" rx="28" fill="#ffffff" opacity="0.06"/>
  <!-- inner hairline -->
  <rect x="64" y="59" width="872" height="202" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>

  <!-- text content -->
  <text x="500" y="140" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="46" font-weight="700" fill="url(#nameGrad)">Giri M</text>
  <text x="500" y="178" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="17" fill="#d8d8f5" letter-spacing="0.5">AI Developer &#183; Full-Stack Engineer &#183; Lifelong Learner</text>

  <!-- pill tags -->
  <g font-family="JetBrains Mono, monospace" font-size="12.5" fill="#e8e8ff">
    <rect x="330" y="205" width="110" height="30" rx="15" fill="#ffffff" opacity="0.08" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="385" y="224" text-anchor="middle">Curious</text>

    <rect x="450" y="205" width="130" height="30" rx="15" fill="#ffffff" opacity="0.08" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="515" y="224" text-anchor="middle">Ships Fast</text>

    <rect x="590" y="205" width="150" height="30" rx="15" fill="#ffffff" opacity="0.08" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="665" y="224" text-anchor="middle">Solves Real Problems</text>
  </g>
</svg>
